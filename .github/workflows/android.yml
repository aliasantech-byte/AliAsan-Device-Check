
name: Build AliAsan Device Check

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بررسی نسخه Gradle
        run: gradle --version

      - name: ساخت APK با گزارش خطای کامل
        run: gradle assembleDebug --stacktrace --info

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AliAsan-Device-Check
          path: app/build/outputs/apk/debug/app-debug.apk
