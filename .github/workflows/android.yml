name: Build AliAsan Device Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check Gradle Version
        run: gradle --version

      - name: Build APK and Show Kotlin Errors
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --info 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          echo "===== Kotlin Errors ====="
          grep -n -E '(^e:|Unresolved reference|Expecting|Type mismatch|Compilation error|error:)' build.log || true
          exit "$build_status"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AliAsan-Device-Check-v1.0
          path: app/build/outputs/apk/debug/app-debug.apk