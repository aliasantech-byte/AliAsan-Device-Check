
name: Build AliAsan Device Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIASAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/aliasan-release.jks"

          test -s "$RUNNER_TEMP/aliasan-release.jks"
          chmod 600 "$RUNNER_TEMP/aliasan-release.jks"

      - name: Verify Release Keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ALIASAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIASAN_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Keystore password or alias secret is missing."
            exit 1
          fi

          keytool -list \
            -keystore "$RUNNER_TEMP/aliasan-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Keystore verification successful."

      - name: Build Signed Release APK
        shell: bash
        env:
          ALIASAN_KEYSTORE_FILE: ${{ runner.temp }}/aliasan-release.jks
          ALIASAN_KEYSTORE_PASSWORD: ${{ secrets.ALIASAN_KEYSTORE_PASSWORD }}
          ALIASAN_KEY_ALIAS: ${{ secrets.ALIASAN_KEY_ALIAS }}
          ALIASAN_KEY_PASSWORD: ${{ secrets.ALIASAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK Output
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "Release APK was not generated."
            exit 1
          fi

          mkdir -p release-output
          cp "$APK_PATH" release-output/AliAsan-Device-Check-v1.0.apk

          echo "Release APK generated successfully."

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AliAsan-Device-Check-v1.0-Release
          path: release-output/AliAsan-Device-Check-v1.0.apk
          if-no-files-found: error
          retention-days: 14
