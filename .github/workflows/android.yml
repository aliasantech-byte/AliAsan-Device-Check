name: Build AliAsan Device Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode Release Keystore
        shell: bash
        env:
          ALIASAN_KEYSTORE_BASE64: ${{ secrets.ALIASAN_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ALIASAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aliasan-release.jks"
          chmod 600 "$RUNNER_TEMP/aliasan-release.jks"

      - name: Verify Keystore
        run: |
          keytool -list -keystore "$RUNNER_TEMP/aliasan-release.jks" -storepass "$ALIASAN_KEYSTORE_PASSWORD"
        env:
          ALIASAN_KEYSTORE_PASSWORD: ${{ secrets.ALIASAN_KEYSTORE_PASSWORD }}

      - name: Build Signed Release APK
        shell: bash
        env:
          ALIASAN_KEYSTORE_FILE: ${{ runner.temp }}/aliasan-release.jks
          ALIASAN_KEYSTORE_PASSWORD: ${{ secrets.ALIASAN_KEYSTORE_PASSWORD }}
          ALIASAN_KEY_ALIAS: ${{ secrets.ALIASAN_KEY_ALIAS }}
          ALIASAN_KEY_PASSWORD: ${{ secrets.ALIASAN_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace --info

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AliAsan-Device-Check-v1.0-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
